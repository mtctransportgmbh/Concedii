name: MTC Daily Backup  # v2 — backup CRIPTAT, salvat doar în repo PRIVAT

on:
  schedule:
    # Orele sunt în UTC. România = UTC+3 vara (DST), UTC+2 iarna.
    # Rulăm la fiecare 4 ore (6x/zi) — mai frecvent decât înainte (3x/zi),
    # ca protecție suplimentară în lipsa unui trigger sigur "la fiecare login"
    # (declanșarea directă din browser ar necesita expunerea unui token
    # GitHub cu drepturi de scriere în codul public al site-ului, ceea ce
    # ar fi un risc de securitate serios — oricine ar putea folosi acel
    # token pentru orice, inclusiv ștergerea codului din repo).
    - cron: '0 3 * * *'   # 06:00 RO (vară) / 05:00 RO (iarnă)
    - cron: '0 7 * * *'   # 10:00 RO / 09:00 RO
    - cron: '0 11 * * *'  # 14:00 RO / 13:00 RO
    - cron: '0 15 * * *'  # 18:00 RO / 17:00 RO
    - cron: '0 19 * * *'  # 22:00 RO / 21:00 RO — rularea "completă", cu email
    - cron: '0 23 * * *'  # 02:00 RO / 01:00 RO
  workflow_dispatch:
    inputs:
      slot:
        description: 'Forțează rularea completă (cu email) indiferent de oră'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 'full'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ── Backup-ul NU mai ajunge în repo-ul public. Se salvează criptat într-un repo PRIVAT separat. ──
      - name: Verifică secretele și că repo-ul de backup e PRIVAT
        env:
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          [ -n "$BACKUP_REPO" ] || { echo "::error::Lipsește secretul BACKUP_REPO (ex: mtctransportgmbh/mtc-concedii-backup)"; exit 1; }
          [ -n "$BACKUP_REPO_TOKEN" ] || { echo "::error::Lipsește secretul BACKUP_REPO_TOKEN"; exit 1; }
          [ ${#BACKUP_ENCRYPTION_KEY} -ge 24 ] || { echo "::error::BACKUP_ENCRYPTION_KEY lipsește sau e sub 24 de caractere"; exit 1; }
          PRIV=$(curl -fsS -H "Authorization: Bearer $BACKUP_REPO_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$BACKUP_REPO" | python3 -c "import sys,json;print(json.load(sys.stdin).get('private'))")
          if [ "$PRIV" != "True" ]; then
            echo "::error::Repo-ul de backup ($BACKUP_REPO) este PUBLIC. Fă-l privat în GitHub (Settings → Danger Zone → Change visibility). Backup oprit."
            exit 1
          fi
          echo "✅ Repo-ul de backup este privat."

      - name: Checkout repo PRIVAT de backup
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: private-backup

      - name: Install dependencies
        run: npm install firebase-admin@12 nodemailer

      - name: Determine run type
        id: slot
        run: |
          INPUT_SLOT="${{ github.event.inputs.slot }}"
          CURRENT_H=$(date -u +%H)
          if [ "$INPUT_SLOT" = "full" ] || [ "$CURRENT_H" = "19" ]; then
            echo "type=full" >> "$GITHUB_OUTPUT"
            echo "Rulare COMPLETĂ (Firestore + fișier criptat + email)"
          else
            echo "type=silent" >> "$GITHUB_OUTPUT"
            echo "Rulare silențioasă (Firestore + fișier criptat, fără email) — ora UTC: $CURRENT_H"
          fi

      - name: Silent backup (Firestore + fișier local)
        if: steps.slot.outputs.type == 'silent'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_OUT_DIR: ${{ github.workspace }}/private-backup/backup
        run: node scripts/backup-silent.js $(date -u +%H)

      - name: Full backup (Firestore + fișier criptat + email)
        if: steps.slot.outputs.type == 'full'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_OUT_DIR: ${{ github.workspace }}/private-backup/backup
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node scripts/backup.js

      # Comitem fișierele CRIPTATE în repo-ul PRIVAT de backup (infrastructură separată de Firebase).
      # Repo-ul public (codul site-ului) nu primește niciun fișier de backup.
      - name: Commit backup criptat în repo-ul privat
        working-directory: private-backup
        run: |
          git config user.name "MTC Backup Bot"
          git config user.email "actions@github.com"
          git add -A backup
          if git diff --staged --quiet; then
            echo "Niciun fișier de backup nou de comis."
          else
            git commit -m "🔒 Backup criptat $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Backup criptat comis în repo-ul privat."
          fi
